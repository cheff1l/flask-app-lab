<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('main.home') }}">Моє Портфоліо</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == url_for('main.home') %}active{% endif %}" href="{{ url_for('main.home') }}">Головна</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == url_for('main.resume') %}active{% endif %}" href="{{ url_for('main.resume') }}">Резюме</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == url_for('main.contacts') %}active{% endif %}" href="{{ url_for('main.contacts') }}">Контакти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/users') %}active{% endif %}" href="{{ url_for('users.greetings', name='John', age=30) }}">Користувачі</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/products') %}active{% endif %}" href="{{ url_for('products.index') }}">Продукти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/post') %}active{% endif %}" href="{{ url_for('posts.all_posts') }}">Пости</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                {% if 'username' in session %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('users.profile') }}">Профіль ({{ session['username'] }})</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('users.logout') }}">Вийти</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('users.login') }}">Увійти</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
